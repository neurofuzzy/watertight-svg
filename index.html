<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SVG optimizer for plotters and cutting machines - merge paths, remove overdraw, optimize cut order" />
  <title>Watertight SVG - Plotter Optimizer</title>
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body>
  <div id="app">
    <header class="header">
      <h1>Watertight SVG</h1>
      <p class="subtitle">Optimize SVGs for plotters & cutting machines</p>
    </header>

    <main class="main">
      <section class="drop-zone" id="dropZone">
        <div class="drop-content">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <p class="drop-text">Drop SVG here or <button type="button" id="browseBtn">browse</button></p>
          <input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden />
        </div>
      </section>

      <section class="preview-container" id="previewContainer" hidden>
        <div class="preview-panel">
          <h2>Original</h2>
          <div class="preview-canvas" id="originalPreview"></div>
          <div class="stats" id="originalStats"></div>
        </div>
        <div class="preview-panel">
          <h2>Optimized</h2>
          <div class="preview-canvas" id="optimizedPreview"></div>
          <div class="stats" id="optimizedStats"></div>
        </div>
      </section>

      <aside class="controls" id="controls" hidden>
        <h2>Optimization Settings</h2>

        <div class="control-group">
          <label>
            <input type="checkbox" id="breakApart" />
            Break apart paths (stress test)
          </label>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="mergePaths" checked />
            Merge connected segments
          </label>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="removeOverdraw" checked />
            Remove overdraw
          </label>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="sortPaths" checked />
            Optimize path order
          </label>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="findRegions" />
            Find enclosed regions (Flash-style)
          </label>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="closePaths" checked />
            Close paths with gap tolerance
          </label>
          <div class="slider-group">
            <input type="range" id="gapTolerance" min="0" max="10" step="0.5" value="2" />
            <span id="gapValue">2px</span>
          </div>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="fixWinding" checked />
            Fix path winding
          </label>
          <select id="fillRule">
            <option value="evenodd">Even-Odd</option>
            <option value="nonzero">Non-Zero</option>
          </select>
        </div>

        <div class="actions">
          <button type="button" id="optimizeBtn" class="btn-primary">Optimize</button>
          <button type="button" id="exportBtn" class="btn-secondary" disabled>Export SVG</button>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
