<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SVG optimizer for plotters and cutting machines - merge paths, remove overdraw, optimize cut order" />
  <title>Watertight SVG - Plotter Optimizer</title>
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body>
  <div id="app">
    <main class="main">
      <div id="workspace" class="workspace">
        <div class="preview-panel" style="grid-area: original;">
          <h2>Original</h2>
          <div class="preview-canvas" id="originalPreview"></div>
          <div class="stats" id="originalStats"></div>
        </div>

        <div class="preview-panel" style="grid-area: optimized;">
          <div class="panel-header">
            <h2>Optimized</h2>
            <div class="legend">
              <div class="legend-item"><span class="swatch travel"></span>Travel</div>
              <div class="legend-item"><span class="swatch pen-up"></span>Up</div>
              <div class="legend-item"><span class="swatch pen-down"></span>Down</div>
            </div>
          </div>
          <div class="canvas-container">
            <div class="preview-canvas" id="optimizedPreview"></div>
          </div>
          <div class="stats" id="optimizedStats"></div>
        </div>

        <section class="drop-zone" id="dropZone" style="grid-area: dropzone;">
          <div class="drop-content">
            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <p class="drop-text">Drop SVG here or <button type="button" id="browseBtn">browse</button></p>
            <input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden />
          </div>
        </section>

        <aside class="controls" id="controls" style="grid-area: settings;">
          <h2>Optimization Settings</h2>

          <!-- Presets Selector -->
          <div class="control-group" style="padding-bottom: 0; border-bottom: none;">
            <div class="preset-selector">
              <label class="preset-label">
                <input type="radio" name="preset" value="cutter" checked />
                <span class="preset-bubble">Cutter</span>
              </label>
              <label class="preset-label">
                <input type="radio" name="preset" value="plotter" />
                <span class="preset-bubble">Plotter</span>
              </label>
              <label class="preset-label">
                <input type="radio" name="preset" value="custom" disabled />
                <span class="preset-bubble">Custom</span>
              </label>
            </div>
          </div>

          <div class="control-group">
            <label>
              <input type="checkbox" id="removeOverdraw" checked />
              Remove overdraw
            </label>
          </div>

          <div class="control-group">
            <label>
              <input type="checkbox" id="mergePaths" checked />
              Merge connected segments
            </label>
          </div>

          <div class="control-group">
            <label title="Drop background/paper rectangles that cover the entire page">
              <input type="checkbox" id="discardPageRects" checked />
              Discard page-sized rectangles
            </label>
          </div>

          <div class="control-group">
            <label class="group-label">Fill Strategy</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="fillStrategy" value="none" />
                None
              </label>
              <label class="radio-label">
                <input type="radio" name="fillStrategy" value="close" />
                Close Ends
              </label>
              <label class="radio-label">
                <input type="radio" name="fillStrategy" value="regions" checked />
                Find Regions
              </label>
            </div>
            <div class="slider-group" id="gapToleranceContainer">
              <input type="range" id="gapTolerance" min="0" max="10" step="0.5" value="2" />
              <span id="gapValue">2px</span>
            </div>
          </div>

          <div class="control-group">
            <label>
              <input type="checkbox" id="fixWinding" checked />
              Fix path winding (Even-Odd)
            </label>
          </div>

          <div class="control-group">
            <label>
              <input type="checkbox" id="sortPaths" checked />
              Optimize path order
            </label>
          </div>

          <div class="control-group">
            <label>
              <input type="checkbox" id="layerByDepth" />
              Layer by nesting depth
            </label>
          </div>

          <div class="actions">
            <!-- Optimize button removed, auto-optimize is active -->
            <div class="secondary-actions">
              <button type="button" id="pageSetupBtn" class="btn-secondary">Paper & Units</button>
              <button type="button" id="simulateBtn" class="btn-secondary" disabled>Preview &amp; Plot</button>
              <button type="button" id="exportBtn" class="btn-secondary" disabled>Export SVG</button>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <!-- Page Setup Modal -->
    <div id="pageSetupModal" class="modal hidden">
      <div class="modal-content settings-modal">
        <h3>Page Setup</h3>

        <div class="control-group">
          <div class="settings-grid">
            <label>
              <input type="checkbox" id="scaleToFit" />
              Scale to Fit Paper
            </label>
            <label>
              <input type="checkbox" id="rotateOutput" />
              Rotate 90°
            </label>
          </div>
        </div>

        <div class="control-group">
          <div class="settings-row">
            <label>Units</label>
            <div class="unit-toggle-group">
              <span id="unitLabelMM" style="font-size: 0.8em; opacity: 0.5;">mm</span>
              <label class="switch">
                <input type="checkbox" id="unitToggle" checked>
                <span class="slider round"></span>
              </label>
              <span id="unitLabelIN" style="font-size: 0.8em; font-weight: bold;">in</span>
            </div>
          </div>
        </div>

        <div class="control-group" id="paperSettings" style="opacity: 0.5; pointer-events: none;">
          <!-- Simplified: No presets, just custom W/H -->
          <div class="settings-grid">
            <div class="input-group-vertical">
              <label class="input-label-sm">Width (<span class="unit-label">mm</span>)</label>
              <input type="number" id="customWidth" value="8.5" step="0.1" />
            </div>
            <div class="input-group-vertical">
              <label class="input-label-sm">Height (<span class="unit-label">mm</span>)</label>
              <input type="number" id="customHeight" value="11" step="0.1" />
            </div>
          </div>

          <label>Margin (<span class="unit-label">mm</span>)</label>
          <div class="slider-group">
            <input type="range" id="paperMargin" min="0" max="2" step="0.05" value="0.5" />
            <span id="marginValue">0.5<span class="unit-label">in</span></span>
          </div>
        </div>

        <div class="control-group">
          <label>Pen Weight (mm)</label>
          <div class="slider-group">
            <input type="range" id="penWeight" min="0.1" max="5.0" step="0.1" value="0.3" />
            <span id="penWeightValue">0.3mm</span>
          </div>
        </div>

        <div class="modal-actions">
          <button id="closePageSetupBtn" class="btn-primary">Done</button>
        </div>
      </div>
    </div>

    <!-- Preview & Plot: one dialog so paper placement is visible while the
         settings that determine it are being changed. -->
    <div id="plotModal" class="modal hidden">
      <div class="modal-content plot-layout">
        <button class="modal-close" id="closePlotBtn">&times;</button>

        <!-- Preview -->
        <div class="plot-main">
          <!-- The machine itself: pen carriage riding the gantry rail, drawn
               along the top edge so the preview below reads as the bed. -->
          <div class="plot-machine-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
            </svg>
            <svg class="rail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: -20.5px;">
              <rect width="30" height="12" x="2" y="6" rx="2" />
              <path d="M12 12h.01" />
              <path d="M17 12h.01" />
              <path d="M22 12h.01" />
              <path d="M27 12h.01" />
              <path d="M7 12h.01" />
            </svg>
            <span>Relative to AxiDraw along top edge</span>
          </div>
          <div class="sim-canvas-container">
            <canvas id="simCanvas"></canvas>
            <div class="plot-empty hidden" id="plotEmpty">
              Select a machine to see the paper on the bed.
            </div>
          </div>
          <div class="sim-controls">
            <button id="simPlayPause" class="icon-btn">
              <!-- Play Icon -->
              <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              <!-- Pause Icon (hidden by default) -->
              <svg class="pause-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>

            <div class="sim-time" id="simTime">0:00 / 0:00</div>

            <div class="sim-scrubber-container">
              <input type="range" id="simScrubber" min="0" max="100" value="100" step="0.1" />
              <div class="sim-progress-bar" id="simProgressBar"></div>
            </div>

            <div class="sim-speed-container">
              <span class="speed-label">Speed</span>
              <select id="simSpeed">
                <option value="1">1x</option>
                <option value="5">5x</option>
                <option value="10" selected>10x</option>
                <option value="50">50x</option>
                <option value="100">100x</option>
              </select>
              <div class="blot-toggle">
                <input type="checkbox" id="simBlots" />
                <label for="simBlots">Blots</label>
              </div>
              <div class="blot-toggle">
                <input type="checkbox" id="simTravel" checked />
                <label for="simTravel">Travel</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Settings -->
        <aside class="plot-sidebar">
          <h3>Preview &amp; Plot</h3>

          <div class="control-group">
            <div class="input-group-vertical">
              <label class="input-label-sm">Machine</label>
              <!-- No default: the envelope is the only thing standing between a
                   bad number and the end stops, so it must be chosen, not guessed. -->
              <select id="plotMachine">
                <option value="" selected>Select your machine…</option>
                <option value="Mini">AxiDraw Mini (152 × 101 mm)</option>
                <option value="V3">AxiDraw V3 / SE — A4 (280 × 218 mm)</option>
                <option value="V3A3">AxiDraw V3/A3 / SE-A3 (430 × 297 mm)</option>
                <option value="V3XL">AxiDraw V3 XL (595 × 218 mm)</option>
              </select>
            </div>
          </div>

          <div class="control-group">
            <label class="group-label">Pen</label>
            <div class="settings-grid">
              <div class="input-group-vertical">
                <label class="input-label-sm">Down speed <span class="unit-note" id="plotSpeedDownMms">25 mm/s</span></label>
                <input type="number" id="plotSpeedDown" min="1" max="100" step="1" value="50" />
              </div>
              <div class="input-group-vertical">
                <label class="input-label-sm">Up speed <span class="unit-note" id="plotSpeedUpMms">100 mm/s</span></label>
                <input type="number" id="plotSpeedUp" min="1" max="100" step="1" value="100" />
              </div>
              <div class="input-group-vertical">
                <label class="input-label-sm">Down position</label>
                <input type="number" id="plotPenDown" min="0" max="100" step="1" value="30" />
              </div>
              <div class="input-group-vertical">
                <label class="input-label-sm">Up position</label>
                <input type="number" id="plotPenUp" min="0" max="100" step="1" value="60" />
              </div>
              <div class="input-group-vertical">
                <label class="input-label-sm">Up delay <span class="unit-note">ms</span></label>
                <input type="number" id="plotDelayUp" min="0" max="2000" step="10" value="0" />
              </div>
              <div class="input-group-vertical">
                <label class="input-label-sm">Down delay <span class="unit-note">ms</span></label>
                <input type="number" id="plotDelayDown" min="0" max="2000" step="10" value="0" />
              </div>
            </div>
          </div>

          <!-- Everything below needs WebSerial; hidden entirely without it so
               the dialog still works as a preview in Safari and Firefox. -->
          <div id="plotConnectSection">
            <div class="control-group">
              <label>
                <input type="checkbox" id="plotFollow" checked />
                Follow the pen in the preview
              </label>
            </div>

            <div class="plot-actions" id="plotActions">
              <button id="plotConnectBtn" class="btn-secondary">Connect</button>
              <button id="plotMotorsBtn" class="btn-secondary" disabled>Release motors</button>
              <button id="plotHomeMachineBtn" class="btn-secondary" disabled>Home machine</button>
              <button id="plotCancelBtn" class="btn-secondary hidden">Stop</button>
              <button id="plotStartBtn" class="btn-primary" disabled>Plot</button>
            </div>

            <!-- Both collapse when empty; only problems and live progress show. -->
            <div class="sim-scrubber-container plot-progress-track hidden" id="plotProgressWrap">
              <div class="sim-progress-bar" id="plotProgressBar"></div>
            </div>
            <div id="plotFirmware" class="plot-firmware"></div>
            <div id="plotStatus" class="plot-status"></div>
          </div>
        </aside>

        <!-- Status and actions -->
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="https://github.com/neurofuzzy/watertight-svg" target="_blank" rel="noopener" title="View on GitHub">
      <svg class="octocat" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
      </svg>
    </a>
    <span class="footer-text">by <a href="https://github.com/neurofuzzy" target="_blank"
        rel="noopener">neurofuzzy</a></span>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
