name: Deploy to GitHub Pages

# Publishes the built app to the gh-pages branch, which is this repo's Pages
# source. Pushing that branch is what triggers GitHub's own generated
# "pages-build-deployment" run - that workflow is synthesized by GitHub and
# never exists in this folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to push the built output to the gh-pages branch
permissions:
  contents: write

# Never let two deploys race to publish gh-pages
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # Two gh-pages gotchas, both worked around here rather than fought:
      #   1. Its -u flag parses the identity with an RFC 5322 address parser,
      #      which rejects the square brackets in github-actions[bot]. Set the
      #      identity in git instead; gh-pages reads it when -u is omitted.
      #   2. It pushes from its own clone under node_modules/.cache, so it never
      #      sees the credentials actions/checkout wrote into the workspace
      #      repo's local config. Hand it an authenticated URL with -r.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
